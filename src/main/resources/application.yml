spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/huertos}
    username: ${DB_USER:huertos}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
huertos:
  storage: ${UPLOAD_DIR:./uploads}
  points:
    community: ${COMMUNITY_POINTS:10}
    preparation: ${PREPARATION_POINTS:15}
    sowing: ${SOWING_POINTS:20}
    care: ${CARE_POINTS:10}
    harvest: ${HARVEST_POINTS:25}
  levels:
    official: ${OFFICIAL_THRESHOLD:100}
    master: ${MASTER_THRESHOLD:300}
  demo: false
---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:./data/huertos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
huertos:
  demo: true
